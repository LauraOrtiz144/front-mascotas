<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Mascotas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>Mis Mascotas</h1>
      <p class="app__subtitle">Conectado a la API de Mascotas</p>
    </header>

    <form id="pet-form" class="task-form">
      <div class="task-form__row">
        <input type="text" id="nombre-input" placeholder="Nombre" maxlength="60" required />
      </div>
      <div class="task-form__row task-form__row--split">
        <input type="text" id="especie-input" placeholder="Especie (Perro, Gato...)" maxlength="40" required />
        <input type="text" id="raza-input" placeholder="Raza" maxlength="60" required />
      </div>
      <div class="task-form__row task-form__row--split">
        <input type="number" id="edad-input" placeholder="Edad (años)" min="0" step="1" required />
        <label class="check-label">
          <input type="checkbox" id="vacunada-input" />
          Vacunada
        </label>
      </div>
      <button type="submit" class="btn btn--primary">
        <span>Agregar mascota</span>
      </button>
    </form>

    <div id="status" class="status" role="status" aria-live="polite" hidden></div>

    <section class="task-list-section">
      <div class="task-list-header">
        <h2>Sin vacunar <span id="count-pending" class="count-badge">0</span></h2>
      </div>
      <ul id="pending-list" class="task-list"></ul>

      <div class="task-list-header task-list-header--done">
        <h2>Vacunadas <span id="count-done" class="count-badge">0</span></h2>
      </div>
      <ul id="done-list" class="task-list"></ul>

      <p id="empty-message" class="empty-message" hidden>
        No tienes mascotas registradas todavía. ¡Agrega la primera!
      </p>
    </section>
  </main>

  <div id="edit-modal" class="modal" hidden>
    <div class="modal__backdrop" data-close-modal></div>
    <div class="modal__content">
      <h3>Editar mascota</h3>
      <form id="edit-form">
        <input type="hidden" id="edit-id" />
        <label for="edit-nombre">Nombre</label>
        <input type="text" id="edit-nombre" maxlength="60" required />
        <label for="edit-especie">Especie</label>
        <input type="text" id="edit-especie" maxlength="40" required />
        <label for="edit-raza">Raza</label>
        <input type="text" id="edit-raza" maxlength="60" required />
        <label for="edit-edad">Edad (años)</label>
        <input type="number" id="edit-edad" min="0" step="1" required />
        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" data-close-modal>Cancelar</button>
          <button type="submit" class="btn btn--primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
